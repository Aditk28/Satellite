[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = arduino
lib_deps =
    askuric/Simple FOC
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BusIO @ ^1.14.1
    adafruit/Adafruit INA219 @ ^1.2.3
lib_archive = false
upload_protocol = mbed
monitor_speed = 921600
monitor_echo = yes
monitor_eol = LF