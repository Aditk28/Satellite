; ============================================================================
; Docking Platform — Reaction Wheel RTOS Skeleton
; Board: ST Nucleo-F446RE
; ============================================================================

; ---------------------------------------------------------------------------
; One sketch owns setup()/loop() per build. Rather than moving files in and out
; of src/, each environment filters which sketch compiles (build_src_filter);
; all the infrastructure .cpp/.h stay put and compile into every build. Switch
; with:  pio run -e superloop -t upload   /   pio run -e p1test -t upload
;   superloop : heading_control.cpp  — the working controller (default)
;   p1test    : p1_test.cpp          — Phase 1 throwaway RTOS test harness
;   (rtos)    : rtos_main.cpp         — added in Phase 2
; ---------------------------------------------------------------------------
[platformio]
default_envs = superloop

[env]
platform      = ststm32
board         = nucleo_f446re
framework     = arduino

; --- lib_archive = false is REQUIRED for SimpleFOC to compile under PlatformIO ---
lib_archive = false

; Pinned to exact installed versions (Step 1.1) so the LDF can't silently drift a
; controller-relevant dependency. These are the versions the Phase 0 baseline was
; built and verified against; SimpleFOC 2.4.0 matches CONTROL_README. Bump
; deliberately, re-run the golden dataset, then update these — never via `^`.
lib_deps =
    askuric/Simple FOC @ 2.4.0
    stm32duino/STM32duino FreeRTOS @ 10.3.3
    adafruit/Adafruit MPU6050 @ 2.2.9
    adafruit/Adafruit INA219 @ 1.2.3
    adafruit/Adafruit Unified Sensor @ 1.1.15
    adafruit/Adafruit BusIO @ 1.17.4


monitor_speed = 115200
upload_protocol = stlink
debug_tool = stlink
monitor_echo = yes
monitor_eol = LF
extra_scripts = use_plain_ar.py

; --- Known issue: STM32duino FreeRTOS can hang on boot / silent USB serial
;     unless the heap manager is switched to heap_3 (standard malloc/free).
;     This is the most commonly cited fix in the PlatformIO community threads
;     for "FreeRTOS makes the board do nothing." Keep this flag. ---
build_flags =
    -D configMEMMANG_HEAP_NB=3
    ; Put project include/ on the GLOBAL include path so the FreeRTOS *library*
    ; (kernel) TUs also find our STM32FreeRTOSConfig.h. Without this, PlatformIO
    ; gives include/ only to project src/ TUs, and the kernel silently compiles
    ; against FreeRTOSConfig_Default.h — a split-brain config (Step 1.3).
    ; Relative path (no backslashes) so it isn't mangled on Windows; PlatformIO
    ; rebases it to the project directory.
    -Iinclude

; --- Per-sketch environments (see header). Each excludes the OTHER sketches'
;     setup()/loop() owners so exactly one is linked. Excluding a not-yet-created
;     file (rtos_main.cpp) is harmless. ---
[env:superloop]
build_src_filter = +<*> -<p1_test.cpp> -<rtos_main.cpp> -<enc_test.cpp> -<fan_test.cpp> -<fan_dma_test.cpp>

[env:p1test]
build_src_filter = +<*> -<heading_control.cpp> -<rtos_main.cpp> -<enc_test.cpp> -<fan_test.cpp> -<fan_dma_test.cpp>

[env:rtos]
build_src_filter = +<*> -<heading_control.cpp> -<p1_test.cpp> -<enc_test.cpp> -<fan_test.cpp> -<fan_dma_test.cpp>

; Standalone translation-fan ESC test — ONLY fan_test.cpp compiles (servo PWM on
; TIM1, no FreeRTOS/SimpleFOC/sensors). Proves the ESC + motor + wiring chain in
; isolation.  pio run -e fantest -t upload
[env:fantest]
build_src_filter = -<*> +<fan_test.cpp>
lib_deps =

; Standalone DSHOT300 via TIM1 + DMA burst — ONLY fan_dma_test.cpp compiles (raw
; CMSIS, no FreeRTOS/SimpleFOC/sensors). The Step 1.1 proving ground: same ESC,
; same commands as fantest, so the bit-bang and the DMA path can be A/B'd on the
; same hardware by changing -e. ch4 must be moved A0 -> CN10-14 (PA11) first.
;   pio run -e fandma -t upload
[env:fandma]
build_src_filter = -<*> +<fan_dma_test.cpp>
lib_deps =

; Standalone MT6701 encoder test — ONLY enc_test.cpp compiles (bare-metal SPI,
; no FreeRTOS/SimpleFOC/motor). lib_deps emptied so nothing else links in.
; Proves the encoder + wiring + SCK pin in isolation.  pio run -e enctest -t upload
[env:enctest]
build_src_filter = -<*> +<enc_test.cpp>
lib_deps =