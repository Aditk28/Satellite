; Docking platform firmware, ST Nucleo-F446RE
;   pio run -e rtos -t upload

[platformio]
default_envs = rtos

[env:rtos]
platform      = ststm32
board         = nucleo_f446re
framework     = arduino

; SimpleFOC does not compile under PlatformIO with library archiving on.
lib_archive = false

; Pinned on purpose. Bump deliberately and re-verify the controller.
lib_deps =
    askuric/Simple FOC @ 2.4.0
    stm32duino/STM32duino FreeRTOS @ 10.3.3
    adafruit/Adafruit MPU6050 @ 2.2.9
    adafruit/Adafruit INA219 @ 1.2.3
    adafruit/Adafruit Unified Sensor @ 1.1.15
    adafruit/Adafruit BusIO @ 1.17.4

monitor_speed = 115200
upload_protocol = stlink
debug_tool = stlink
monitor_echo = yes
monitor_eol = LF
extra_scripts = use_plain_ar.py

build_flags =
    ; heap_3 (malloc/free). STM32duino FreeRTOS can hang at boot with the default heap.
    -D configMEMMANG_HEAP_NB=3
    ; Global include path so the FreeRTOS kernel also picks up include/STM32FreeRTOSConfig.h
    ; instead of silently using the library default.
    -Iinclude
